<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 980" width="1180" height="980" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="quadrillageFin" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d3dde6" stroke-width="0.9"/>
    </pattern>
    <pattern id="fondQuadrille" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#ffffff"/>
      <rect width="100" height="100" fill="url(#quadrillageFin)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#b4c4d2" stroke-width="1.6"/>
    </pattern>
  </defs>

  <style>
    .acteur   { stroke: #000000; stroke-width: 1.3; fill: none; }
    .nom      { font-size: 11px; fill: #000000; text-anchor: middle; }
    .uc-txt   { font-size: 10.5px; fill: #000000; text-anchor: middle; }
    .ovale    { fill: #ffffff; stroke: #000000; stroke-width: 1; }
    .assoc    { stroke: #000000; stroke-width: 0.9; fill: none; }
    .rel      { stroke: #000000; stroke-width: 0.9; fill: none; stroke-dasharray: 5 4; }
    .rel-txt  { font-size: 9px; fill: #000000; text-anchor: middle; }
    .cadre    { fill: none; stroke: #000000; stroke-width: 1.2; }
    .cadre-t  { font-size: 12px; fill: #000000; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="1180" height="980" fill="url(#fondQuadrille)"/>

  <!-- Frontiere du systeme -->
  <rect x="300" y="40" width="560" height="890" class="cadre"/>
  <text x="580" y="62" class="cadre-t">FiducialPro</text>

  <!-- ================= ACTEUR : Secretaire ================= -->
  <g transform="translate(150, 230)">
    <circle cx="0" cy="-24" r="11" class="acteur"/>
    <line x1="0" y1="-13" x2="0" y2="14" class="acteur"/>
    <line x1="-16" y1="-2" x2="16" y2="-2" class="acteur"/>
    <line x1="0" y1="14" x2="-13" y2="36" class="acteur"/>
    <line x1="0" y1="14" x2="13" y2="36" class="acteur"/>
    <text x="0" y="54" class="nom">Secretaire</text>
  </g>

  <!-- ================= ACTEUR : Comptable ================= -->
  <g transform="translate(1030, 400)">
    <circle cx="0" cy="-24" r="11" class="acteur"/>
    <line x1="0" y1="-13" x2="0" y2="14" class="acteur"/>
    <line x1="-16" y1="-2" x2="16" y2="-2" class="acteur"/>
    <line x1="0" y1="14" x2="-13" y2="36" class="acteur"/>
    <line x1="0" y1="14" x2="13" y2="36" class="acteur"/>
    <text x="0" y="54" class="nom">Comptable</text>
  </g>

  <!-- ================= ACTEUR : Gerant ================= -->
  <g transform="translate(1030, 650)">
    <circle cx="0" cy="-24" r="11" class="acteur"/>
    <line x1="0" y1="-13" x2="0" y2="14" class="acteur"/>
    <line x1="-16" y1="-2" x2="16" y2="-2" class="acteur"/>
    <line x1="0" y1="14" x2="-13" y2="36" class="acteur"/>
    <line x1="0" y1="14" x2="13" y2="36" class="acteur"/>
    <text x="0" y="54" class="nom">Gerant</text>
  </g>

  <!-- ================= ACTEUR : Administrateur ================= -->
  <g transform="translate(1030, 870)">
    <circle cx="0" cy="-24" r="11" class="acteur"/>
    <line x1="0" y1="-13" x2="0" y2="14" class="acteur"/>
    <line x1="-16" y1="-2" x2="16" y2="-2" class="acteur"/>
    <line x1="0" y1="14" x2="-13" y2="36" class="acteur"/>
    <line x1="0" y1="14" x2="13" y2="36" class="acteur"/>
    <text x="0" y="54" class="nom">Administrateur</text>
  </g>

  <!-- ================= ACTEUR SYSTEME : DGI ================= -->
  <g transform="translate(150, 640)">
    <rect x="-52" y="-16" width="104" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="0" y="5" class="nom">DGI - SIMPL</text>
    <text x="0" y="36" class="rel-txt">&#171;systeme externe&#187;</text>
  </g>

  <!-- ================= CAS D'UTILISATION ================= -->
  <ellipse cx="580" cy="110" rx="120" ry="20" class="ovale"/>
  <text x="580" y="114" class="uc-txt">S'authentifier</text>

  <ellipse cx="580" cy="162" rx="120" ry="20" class="ovale"/>
  <text x="580" y="166" class="uc-txt">Consulter les clients</text>

  <ellipse cx="580" cy="214" rx="120" ry="20" class="ovale"/>
  <text x="580" y="218" class="uc-txt">Creer une fiche client</text>

  <ellipse cx="580" cy="266" rx="120" ry="20" class="ovale"/>
  <text x="580" y="270" class="uc-txt">Deposer un document</text>

  <ellipse cx="580" cy="318" rx="120" ry="20" class="ovale"/>
  <text x="580" y="322" class="uc-txt">Planifier une echeance</text>

  <ellipse cx="580" cy="370" rx="120" ry="20" class="ovale"/>
  <text x="580" y="374" class="uc-txt">Consulter le tableau de bord</text>

  <ellipse cx="580" cy="422" rx="120" ry="20" class="ovale"/>
  <text x="580" y="426" class="uc-txt">Modifier un client</text>

  <ellipse cx="580" cy="474" rx="120" ry="20" class="ovale"/>
  <text x="580" y="478" class="uc-txt">Gerer les dossiers</text>

  <ellipse cx="580" cy="526" rx="120" ry="20" class="ovale"/>
  <text x="580" y="530" class="uc-txt">Affecter des collaborateurs</text>

  <ellipse cx="580" cy="578" rx="120" ry="20" class="ovale"/>
  <text x="580" y="582" class="uc-txt">Saisir une declaration</text>

  <ellipse cx="580" cy="630" rx="120" ry="20" class="ovale"/>
  <text x="580" y="634" class="uc-txt">Teledeposer (SIMPL)</text>

  <ellipse cx="580" cy="682" rx="120" ry="20" class="ovale"/>
  <text x="580" y="686" class="uc-txt">Emettre une facture</text>

  <ellipse cx="580" cy="734" rx="120" ry="20" class="ovale"/>
  <text x="580" y="738" class="uc-txt">Enregistrer un reglement</text>

  <ellipse cx="580" cy="786" rx="120" ry="20" class="ovale"/>
  <text x="580" y="790" class="uc-txt">Exporter un rapport</text>

  <ellipse cx="580" cy="838" rx="120" ry="20" class="ovale"/>
  <text x="580" y="842" class="uc-txt">Supprimer un client</text>

  <ellipse cx="580" cy="890" rx="120" ry="20" class="ovale"/>
  <text x="580" y="894" class="uc-txt">Gerer les utilisateurs</text>

  <!-- ================= RELATIONS include vers S'authentifier ================= -->
  <path d="M 460 162 C 418 154, 414 124, 458 112" class="rel"/>
  <polygon points="458,112 448,111 452,120" fill="#000000"/>
  <text x="404" y="140" class="rel-txt">&#171;include&#187;</text>

  <path d="M 460 214 C 386 200, 382 128, 458 114" class="rel"/>
  <polygon points="458,114 448,112 452,122" fill="#000000"/>
  <text x="366" y="172" class="rel-txt">&#171;include&#187;</text>

  <!-- ================= ASSOCIATIONS : Secretaire ================= -->
  <line x1="180" y1="212" x2="460" y2="112" class="assoc"/>
  <line x1="180" y1="220" x2="460" y2="163" class="assoc"/>
  <line x1="180" y1="228" x2="460" y2="214" class="assoc"/>
  <line x1="180" y1="238" x2="460" y2="266" class="assoc"/>
  <line x1="180" y1="246" x2="460" y2="318" class="assoc"/>
  <line x1="180" y1="254" x2="460" y2="370" class="assoc"/>

  <!-- ================= ASSOCIATIONS : Comptable ================= -->
  <line x1="1000" y1="382" x2="700" y2="112" class="assoc"/>
  <line x1="1000" y1="388" x2="700" y2="164" class="assoc"/>
  <line x1="1000" y1="394" x2="700" y2="372" class="assoc"/>
  <line x1="1000" y1="400" x2="700" y2="422" class="assoc"/>
  <line x1="1000" y1="406" x2="700" y2="474" class="assoc"/>
  <line x1="1000" y1="412" x2="700" y2="526" class="assoc"/>
  <line x1="1000" y1="418" x2="700" y2="578" class="assoc"/>
  <line x1="1000" y1="424" x2="700" y2="630" class="assoc"/>
  <line x1="1000" y1="430" x2="700" y2="682" class="assoc"/>
  <line x1="1000" y1="436" x2="700" y2="734" class="assoc"/>
  <line x1="1000" y1="442" x2="700" y2="786" class="assoc"/>

  <!-- ================= ASSOCIATIONS : Gerant ================= -->
  <line x1="1000" y1="636" x2="700" y2="216" class="assoc"/>
  <line x1="1000" y1="660" x2="700" y2="838" class="assoc"/>

  <!-- ================= ASSOCIATIONS : Administrateur ================= -->
  <line x1="1000" y1="862" x2="700" y2="890" class="assoc"/>

  <!-- ================= LIAISON DGI ================= -->
  <line x1="205" y1="628" x2="460" y2="632" class="assoc"/>

  <!-- ================= GENERALISATIONS ENTRE ACTEURS ================= -->
  <line x1="1030" y1="613" x2="1030" y2="478" class="assoc"/>
  <polygon points="1030,462 1021,480 1039,480" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <line x1="1030" y1="833" x2="1030" y2="728" class="assoc"/>
  <polygon points="1030,712 1021,730 1039,730" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
</svg>
