<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="quadrillageFin" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d3dde6" stroke-width="0.9"/>
    </pattern>
    <pattern id="fondQuadrille" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#ffffff"/>
      <rect width="100" height="100" fill="url(#quadrillageFin)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#b4c4d2" stroke-width="1.6"/>
    </pattern>
  </defs>

  <style>
    .acteur   { stroke: #000000; stroke-width: 1.3; fill: none; }
    .nom      { font-size: 11px; fill: #000000; text-anchor: middle; }
    .uc-txt   { font-size: 10.5px; fill: #000000; text-anchor: middle; }
    .ovale    { fill: #ffffff; stroke: #000000; stroke-width: 1; }
    .assoc    { stroke: #000000; stroke-width: 0.9; fill: none; }
    .rel      { stroke: #000000; stroke-width: 0.9; fill: none; stroke-dasharray: 5 4; }
    .rel-txt  { font-size: 9px; fill: #000000; text-anchor: middle; }
    .cadre    { fill: none; stroke: #000000; stroke-width: 1.2; }
    .cadre-t  { font-size: 12px; fill: #000000; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="1180" height="900" fill="url(#fondQuadrille)"/>

  <!-- Frontiere du systeme -->
  <rect x="300" y="40" width="560" height="820" class="cadre"/>
  <text x="580" y="62" class="cadre-t">FiducialPro</text>

  <!-- ================= ACTEUR : Secretaire ================= -->
  <g transform="translate(150, 200)">
    <circle cx="0" cy="-24" r="11" class="acteur"/>
    <line x1="0" y1="-13" x2="0" y2="14" class="acteur"/>
    <line x1="-16" y1="-2" x2="16" y2="-2" class="acteur"/>
    <line x1="0" y1="14" x2="-13" y2="36" class="acteur"/>
    <line x1="0" y1="14" x2="13" y2="36" class="acteur"/>
    <text x="0" y="54" class="nom">Secretaire</text>
  </g>

  <!-- ================= ACTEUR : Comptable ================= -->
  <g transform="translate(1030, 330)">
    <circle cx="0" cy="-24" r="11" class="acteur"/>
    <line x1="0" y1="-13" x2="0" y2="14" class="acteur"/>
    <line x1="-16" y1="-2" x2="16" y2="-2" class="acteur"/>
    <line x1="0" y1="14" x2="-13" y2="36" class="acteur"/>
    <line x1="0" y1="14" x2="13" y2="36" class="acteur"/>
    <text x="0" y="54" class="nom">Comptable</text>
  </g>

  <!-- ================= ACTEUR : Gerant ================= -->
  <g transform="translate(1030, 570)">
    <circle cx="0" cy="-24" r="11" class="acteur"/>
    <line x1="0" y1="-13" x2="0" y2="14" class="acteur"/>
    <line x1="-16" y1="-2" x2="16" y2="-2" class="acteur"/>
    <line x1="0" y1="14" x2="-13" y2="36" class="acteur"/>
    <line x1="0" y1="14" x2="13" y2="36" class="acteur"/>
    <text x="0" y="54" class="nom">Gerant</text>
  </g>

  <!-- ================= ACTEUR : Administrateur ================= -->
  <g transform="translate(1030, 790)">
    <circle cx="0" cy="-24" r="11" class="acteur"/>
    <line x1="0" y1="-13" x2="0" y2="14" class="acteur"/>
    <line x1="-16" y1="-2" x2="16" y2="-2" class="acteur"/>
    <line x1="0" y1="14" x2="-13" y2="36" class="acteur"/>
    <line x1="0" y1="14" x2="13" y2="36" class="acteur"/>
    <text x="0" y="54" class="nom">Administrateur</text>
  </g>

  <!-- ================= ACTEUR SYSTEME : DGI ================= -->
  <g transform="translate(150, 620)">
    <rect x="-52" y="-16" width="104" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="0" y="5" class="nom">DGI - SIMPL</text>
    <text x="0" y="36" class="rel-txt">&#171;systeme externe&#187;</text>
  </g>

  <!-- ================= CAS D'UTILISATION ================= -->
  <ellipse cx="580" cy="110" rx="120" ry="20" class="ovale"/>
  <text x="580" y="114" class="uc-txt">S'authentifier</text>

  <ellipse cx="580" cy="165" rx="120" ry="20" class="ovale"/>
  <text x="580" y="169" class="uc-txt">Consulter les clients</text>

  <ellipse cx="580" cy="220" rx="120" ry="20" class="ovale"/>
  <text x="580" y="224" class="uc-txt">Creer une fiche client</text>

  <ellipse cx="580" cy="275" rx="120" ry="20" class="ovale"/>
  <text x="580" y="279" class="uc-txt">Deposer un document</text>

  <ellipse cx="580" cy="330" rx="120" ry="20" class="ovale"/>
  <text x="580" y="334" class="uc-txt">Planifier une echeance</text>

  <ellipse cx="580" cy="385" rx="120" ry="20" class="ovale"/>
  <text x="580" y="389" class="uc-txt">Modifier un client</text>

  <ellipse cx="580" cy="440" rx="120" ry="20" class="ovale"/>
  <text x="580" y="444" class="uc-txt">Gerer les dossiers</text>

  <ellipse cx="580" cy="495" rx="120" ry="20" class="ovale"/>
  <text x="580" y="499" class="uc-txt">Saisir une declaration</text>

  <ellipse cx="580" cy="550" rx="120" ry="20" class="ovale"/>
  <text x="580" y="554" class="uc-txt">Teledeposer (SIMPL)</text>

  <ellipse cx="580" cy="605" rx="120" ry="20" class="ovale"/>
  <text x="580" y="609" class="uc-txt">Emettre une facture</text>

  <ellipse cx="580" cy="660" rx="120" ry="20" class="ovale"/>
  <text x="580" y="664" class="uc-txt">Enregistrer un reglement</text>

  <ellipse cx="580" cy="715" rx="120" ry="20" class="ovale"/>
  <text x="580" y="719" class="uc-txt">Exporter un rapport</text>

  <ellipse cx="580" cy="770" rx="120" ry="20" class="ovale"/>
  <text x="580" y="774" class="uc-txt">Supprimer un client</text>

  <ellipse cx="580" cy="825" rx="120" ry="20" class="ovale"/>
  <text x="580" y="829" class="uc-txt">Gerer les utilisateurs</text>

  <!-- ================= RELATIONS include ================= -->
  <path d="M 655 640 C 690 630, 700 620, 690 600" class="rel"/>
  <polygon points="690,600 685,610 695,609" fill="#000000"/>
  <text x="726" y="626" class="rel-txt">&#171;include&#187;</text>

  <path d="M 655 530 C 690 522, 700 512, 690 496" class="rel"/>
  <polygon points="690,496 685,506 695,505" fill="#000000"/>
  <text x="726" y="520" class="rel-txt">&#171;include&#187;</text>

  <!-- ================= ASSOCIATIONS : Secretaire ================= -->
  <line x1="182" y1="185" x2="461" y2="112" class="assoc"/>
  <line x1="182" y1="192" x2="461" y2="166" class="assoc"/>
  <line x1="182" y1="200" x2="461" y2="220" class="assoc"/>
  <line x1="182" y1="208" x2="461" y2="274" class="assoc"/>
  <line x1="182" y1="215" x2="461" y2="329" class="assoc"/>

  <!-- ================= ASSOCIATIONS : Comptable ================= -->
  <line x1="998" y1="318" x2="700" y2="112" class="assoc"/>
  <line x1="998" y1="324" x2="700" y2="167" class="assoc"/>
  <line x1="998" y1="330" x2="700" y2="386" class="assoc"/>
  <line x1="998" y1="336" x2="700" y2="441" class="assoc"/>
  <line x1="998" y1="342" x2="700" y2="496" class="assoc"/>
  <line x1="998" y1="348" x2="700" y2="551" class="assoc"/>
  <line x1="998" y1="354" x2="700" y2="606" class="assoc"/>
  <line x1="998" y1="360" x2="700" y2="661" class="assoc"/>
  <line x1="998" y1="366" x2="700" y2="716" class="assoc"/>

  <!-- ================= ASSOCIATIONS : Gerant ================= -->
  <line x1="998" y1="562" x2="700" y2="771" class="assoc"/>

  <!-- ================= ASSOCIATIONS : Administrateur ================= -->
  <line x1="998" y1="782" x2="700" y2="826" class="assoc"/>

  <!-- ================= LIAISON DGI ================= -->
  <line x1="205" y1="608" x2="461" y2="556" class="assoc"/>

  <!-- ================= GENERALISATIONS ENTRE ACTEURS ================= -->
  <line x1="1030" y1="536" x2="1030" y2="410" class="assoc"/>
  <polygon points="1030,394 1021,412 1039,412" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <line x1="1030" y1="756" x2="1030" y2="650" class="assoc"/>
  <polygon points="1030,634 1021,652 1039,652" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
</svg>
