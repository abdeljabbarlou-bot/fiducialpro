    <rect x="670" y="300" width="20" height="12" class="comp"/>
    <rect x="670" y="318" width="20" height="12" class="comp"/>
    <text x="780" y="310" class="stereo">&#171;composant&#187;</text>
    <text x="780" y="326" class="comp-nom">Politiques d'autorisation</text>
