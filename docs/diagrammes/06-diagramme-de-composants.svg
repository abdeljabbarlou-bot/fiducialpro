  <text x="134" y="434" class="couche-t">COUCHE MÉTIER (SERVICES)</text>

  <g>
    <rect x="150" y="448" width="180" height="50" class="comp"/>
    <rect x="140" y="458" width="18" height="11" class="comp"/>
    <rect x="140" y="474" width="18" height="11" class="comp"/>
    <text x="240" y="470" class="stereo">&#171;composant&#187;</text>
    <text x="240" y="486" class="comp-nom">InvoiceService</text>
  </g>

  <g>
    <rect x="360" y="448" width="180" height="50" class="comp"/>
    <rect x="350" y="458" width="18" height="11" class="comp"/>
    <rect x="350" y="474" width="18" height="11" class="comp"/>
    <text x="450" y="470" class="stereo">&#171;composant&#187;</text>
    <text x="450" y="486" class="comp-nom">PaymentService</text>
  </g>

  <g>
    <rect x="570" y="448" width="180" height="50" class="comp"/>
    <rect x="560" y="458" width="18" height="11" class="comp"/>
    <rect x="560" y="474" width="18" height="11" class="comp"/>
    <text x="660" y="470" class="stereo">&#171;composant&#187;</text>
    <text x="660" y="486" class="comp-nom">DeclarationService</text>
  </g>

  <g>
    <rect x="780" y="448" width="160" height="50" class="comp"/>
    <rect x="770" y="458" width="18" height="11" class="comp"/>
    <rect x="770" y="474" width="18" height="11" class="comp"/>
    <text x="860" y="470" class="stereo">&#171;composant&#187;</text>
    <text x="860" y="486" class="comp-nom">DocumentService</text>
  </g>

  <g>
    <rect x="255" y="524" width="180" height="50" class="comp"/>
    <rect x="245" y="534" width="18" height="11" class="comp"/>
    <rect x="245" y="550" width="18" height="11" class="comp"/>
    <text x="345" y="546" class="stereo">&#171;composant&#187;</text>
    <text x="345" y="562" class="comp-nom">ExcelReportService</text>
  </g>

  <g>
    <rect x="465" y="524" width="180" height="50" class="comp"/>
    <rect x="455" y="534" width="18" height="11" class="comp"/>
    <rect x="455" y="550" width="18" height="11" class="comp"/>
    <text x="555" y="546" class="stereo">&#171;composant&#187;</text>
    <text x="555" y="562" class="comp-nom">Générateur PDF</text>
  </g>

  <path d="M 240 498 L 240 640" class="dep"/>
  <path d="M 450 498 L 450 640" class="dep"/>
  <path d="M 660 498 L 660 640" class="dep"/>
  <text x="510" y="612" class="dep-txt">persiste via</text>

  <!-- ================= COUCHE PERSISTANCE ================= -->
  <rect x="120" y="644" width="840" height="96" class="couche"/>
  <text x="134" y="662" class="couche-t">COUCHE DE PERSISTANCE</text>

  <g>
    <rect x="360" y="670" width="280" height="54" class="comp"/>
    <rect x="350" y="682" width="20" height="12" class="comp"/>
    <rect x="350" y="700" width="20" height="12" class="comp"/>
    <text x="500" y="692" class="stereo">&#171;composant&#187;</text>
    <text x="500" y="708" class="comp-nom">Modèles Eloquent (ORM)</text>
  </g>

  <path d="M 460 724 L 400 786" class="dep"/>
  <path d="M 560 724 L 700 786" class="dep"/>

  <!-- ================= RESSOURCES ================= -->
  <g>
    <rect x="250" y="790" width="230" height="54" class="comp"/>
    <text x="365" y="812" class="stereo">&#171;base de données&#187;</text>
    <text x="365" y="828" class="comp-nom">Base relationnelle</text>
  </g>

  <g>
    <rect x="600" y="790" width="230" height="54" class="comp"/>
    <text x="715" y="812" class="stereo">&#171;système de fichiers&#187;</text>
    <text x="715" y="828" class="comp-nom">Stockage GED</text>
  </g>
</svg>
